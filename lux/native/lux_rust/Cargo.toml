[package]
name = "lux_rust"
version = "0.1.0"
authors = ["Spectral Finance <dev@spectral.finance>"]
edition = "2021"

[lib]
name = "lux_rust"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.32", default-features = false, features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
async-trait = "0.1"

[profile.release]
lto = true
codegen-units = 1